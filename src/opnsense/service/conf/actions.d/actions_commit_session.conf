[start_watchdog]
command:/usr/sbin/daemon -f -r -P /var/run/commit_watchdog_sup.pid /usr/local/bin/php /usr/local/opnsense/scripts/system/commit_watchdog.php
parameters:
type:script
message:start supervised protected session worker

[check_watchdog]
command:/usr/local/bin/php /usr/local/opnsense/scripts/system/commit_watchdog.php --check
parameters:
type:script
message:check protected session worker
