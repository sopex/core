{% set blockpage = helpers.getNodeByTag('OPNsense.unboundplus.dnsbl.blockpage') or {} %}
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ blockpage.title|default('')|e }}</title>
<style>
body { margin: 0; font-family: sans-serif; background: #f5f5f5; color: #333; }
main { max-width: 40em; margin: 10vh auto; padding: 2em; background: #fff; border-top: 4px solid #d94f00; }
h1 { margin-top: 0; font-size: 1.5em; }
#domain { font-family: monospace; word-break: break-all; }
.message { white-space: pre-line; }
</style>
</head>
<body>
<main>
<h1>{{ blockpage.title|default('')|e }}</h1>
<p id="domain"></p>
<p class="message">{{ blockpage.message|default('')|e }}</p>
</main>
<script>document.getElementById('domain').textContent = window.location.hostname;</script>
</body>
</html>
