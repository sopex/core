{% set blockpage = helpers.getNodeByTag('OPNsense.unboundplus.dnsbl.blockpage') or {} %}
{% if blockpage.enabled|default('0') == '1' and blockpage.address|default('') != '' %}
#############################################################################################
###  Unbound DNSBL block page, static content only
#############################################################################################

server.modules           = ( "mod_rewrite", "mod_setenv" )

server.bind              = "{{ blockpage.address }}"
server.port              = 80

## plain listener on the HTTPS port: TLS handshakes fail immediately instead of
## timing out or being answered by another service listening on the wildcard address
$SERVER["socket"] == "{{ blockpage.address }}:443" { }

server.document-root     = "/usr/local/etc/unbound-blockpage/"
index-file.names         = ( "index.html" )
mimetype.assign          = ( ".html" => "text/html; charset=utf-8" )

## answer every request path with the block page
url.rewrite-once         = ( "^" => "/index.html" )

setenv.add-response-header = (
    "Cache-Control" => "no-store",
    "X-Content-Type-Options" => "nosniff",
    "Content-Security-Policy" => "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
)

server.max-request-size  = 1
server.range-requests    = "disable"
server.max-keep-alive-idle = 5
server.max-read-idle     = 15
server.max-write-idle    = 15

server.username          = "www"
server.groupname         = "www"
server.pid-file          = "/var/run/lighttpd-unbound-blockpage.pid"
server.errorlog-use-syslog = "enable"
server.tag               = "OPNsense"
{% else %}
# block page disabled
{% endif %}
