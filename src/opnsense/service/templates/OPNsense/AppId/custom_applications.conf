{% for application in helpers.toList('OPNsense.AppId.custom.application') %}
{%   if application.enabled == '1' %}
[custom_{{ (application['@uuid']|replace('-', ''))[:16] }}]
name={{ application.name }}
category={{ application.category|default('') }}
risk={{ application.risk|default('3') }}
hosts={{ application.hosts }}

{%   endif %}
{% endfor %}
